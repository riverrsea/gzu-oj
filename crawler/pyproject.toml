[project]
name = "gzu-oj-crawler"
version = "0.1.0"
description = "GZU OJ 题库采集与标准导入包生成 CLI"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.13,<5",
    "httpx>=0.28,<1",
    "markdownify>=1.1,<2",
]

[project.scripts]
gzu-oj-crawler = "gzu_oj_crawler.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.4,<9",
    "respx>=0.22,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gzu_oj_crawler"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
